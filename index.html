<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aveer’s Pad">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DCE9FF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Aveer’s Drawing Pad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one-screen art table — header strip, white paper filling the middle, a crayon tray docked at the bottom. */
:root {
  --bg: #DCE9FF;
  --tray: #FFFFFF;
  --ink: #16233F;
  --muted: #56678A;
  --line: #C3D4F2;
  --sun: #FFC72C;
  --on-sun: #16233F;
  --paper: #FFFFFF;
  --shadow: rgba(22, 35, 63, .16);
  --scrim: rgba(16, 27, 51, .55);
  --font-display: "Grandstander", "Comic Sans MS", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A31; --tray: #1A2949; --ink: #EEF3FF; --muted: #A7B6D6; --line: #2D406E;
    --sun: #FFC72C; --on-sun: #16233F; --paper: #FFFFFF; --shadow: rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A31; --tray: #1A2949; --ink: #EEF3FF; --muted: #A7B6D6; --line: #2D406E;
  --sun: #FFC72C; --on-sun: #16233F; --paper: #FFFFFF; --shadow: rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; touch-action: manipulation;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button, label { touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 3px solid var(--sun); outline-offset: 2px; }

.app {
  height: 100%; max-width: 1180px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px;
}

/* Header */
.top { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: nowrap; }
.title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 3.6vw, 32px); line-height: 1; letter-spacing: .5px; white-space: nowrap; }
.title span { display: inline-block; }
.actions { display: flex; gap: 6px; min-width: 0; }
.act {
  display: flex; align-items: center; gap: 6px;
  height: 46px; padding: 0 12px; border-radius: 14px;
  border: 2.5px solid var(--line); background: var(--tray);
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  transition: transform .12s ease;
}
.act .ic { font-size: 20px; line-height: 1; }
.act .lb { white-space: nowrap; }
.act:active { transform: scale(.92); }
.act:disabled { opacity: .4; cursor: default; }
.act.save { background: var(--sun); color: var(--on-sun); border-color: var(--sun); }

/* Stage + paper */
.stage { flex: 1 1 auto; min-height: 0; position: relative; display: grid; place-items: center; }
.paper {
  position: relative; background: var(--paper); border-radius: 18px;
  box-shadow: 0 10px 30px var(--shadow), 0 0 0 3px var(--line);
  overflow: hidden; touch-action: none; max-width: 100%;
}
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#lines { pointer-events: none; }
.mirror-guide {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 0;
  border-left: 3px dashed rgba(126, 87, 194, .45); pointer-events: none;
}

/* Tray */
.tray {
  background: var(--tray); border-radius: 22px; padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 6px 20px var(--shadow);
}
.row {
  display: flex; gap: 8px; align-items: center;
  overflow-x: auto; scrollbar-width: none; padding: 6px;
  justify-content: safe center;
}
.row::-webkit-scrollbar { display: none; }
.tool {
  flex: 0 0 auto; width: 66px; height: 66px; border-radius: 18px;
  border: 2.5px solid var(--line); background: var(--tray);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .15s ease, background .15s ease;
}
.tool .ic { font-size: 28px; line-height: 1.05; }
.tool .lb { font-family: var(--font-display); font-weight: 700; font-size: 12px; }
.tool[aria-pressed="true"] { background: var(--sun); color: var(--on-sun); border-color: var(--on-sun); transform: translateY(-3px) rotate(-3deg); }
.sep { flex: 0 0 auto; width: 2px; height: 46px; background: var(--line); border-radius: 2px; }
.size {
  flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%;
  border: 2.5px solid var(--line); background: var(--tray);
  display: grid; place-items: center;
}
.size i { display: block; border-radius: 50%; background: var(--ink); }
.size[aria-pressed="true"] { background: var(--sun); border-color: var(--on-sun); }
.size[aria-pressed="true"] i { background: var(--on-sun); }

.swatch {
  flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
  border: 3px solid var(--tray); box-shadow: 0 0 0 2px var(--line);
  transition: transform .15s ease, box-shadow .15s ease; padding: 0;
}
.swatch[aria-pressed="true"] { transform: scale(1.18); box-shadow: 0 0 0 3px var(--ink); }
.swatch.custom {
  position: relative; display: block; cursor: pointer;
  background: conic-gradient(#E53935, #FDD835, #43A047, #29B6F6, #7E57C2, #EC407A, #E53935);
}
.swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sticker {
  flex: 0 0 auto; width: 52px; height: 52px; border-radius: 14px;
  border: 2.5px solid var(--line); background: var(--tray); font-size: 30px; line-height: 1; padding: 0;
}
.sticker[aria-pressed="true"] { background: var(--sun); border-color: var(--on-sun); transform: scale(1.1); }

/* Sheets */
.sheet { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--tray); color: var(--ink); border-radius: 24px; width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 18px; box-shadow: 0 20px 50px var(--shadow); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; text-wrap: balance; }
.close { width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--tray); font-size: 22px; flex: 0 0 auto; }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.page-btn { border: 3px solid var(--line); background: var(--tray); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.page-btn canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; background: var(--paper); border-radius: 12px; display: block; max-width: 100%; }
.page-btn span { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.page-btn[aria-current="true"] { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 22%, var(--tray)); }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.pic { border: 3px solid var(--line); border-radius: 16px; overflow: hidden; padding: 0; background: var(--paper); }
.pic img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; max-width: 100%; }
.save-status { margin: 0 0 12px; padding: 8px 12px; border-radius: 12px; font-weight: 700; font-size: 15px; line-height: 1.4; }
.save-status.ok { background: color-mix(in srgb, #43A047 16%, var(--tray)); color: color-mix(in srgb, #2E7D32 80%, var(--ink)); }
.save-status.warn { background: color-mix(in srgb, #E53935 16%, var(--tray)); color: color-mix(in srgb, #C62828 80%, var(--ink)); }
.count { margin: 0 0 10px; color: var(--muted); font-weight: 700; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 16px; line-height: 1.5; }
.empty b { display: block; font-family: var(--font-display); font-size: 22px; color: var(--ink); margin-bottom: 6px; }
.viewer img { width: 100%; max-height: 60vh; object-fit: contain; background: var(--paper); border-radius: 14px; display: block; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
.hint { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 12px 0; max-width: 60ch; }
.viewer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.act.danger[data-armed="true"] { background: #E53935; border-color: #E53935; color: #fff; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 700; font-size: 17px;
  padding: 12px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30;
  max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-8deg) } 75% { transform: rotate(8deg) } }
.title span:hover { animation: wiggle .4s ease; }

@media (max-width: 1040px) {
  .act .lb { display: none; }
  .act { padding: 0; width: 46px; justify-content: center; }
}
@media (max-width: 640px) {
  .act { width: 44px; }
  .actions { gap: 5px; }
  .title { font-size: 21px; }
  .tool { width: 60px; height: 60px; }
  .tool .ic { font-size: 25px; }
}
@media (max-width: 520px) {
  .title .long { display: none; }
  .top { flex-wrap: wrap; justify-content: center; row-gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .tool[aria-pressed="true"] { transform: none; }
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="title" aria-label="Aveer's Drawing Pad">
      <span style="color:#E53935">A</span><span style="color:#FB8C00">v</span><span style="color:#F4B400">e</span><span style="color:#43A047">e</span><span style="color:#1E88E5">r</span><span style="color:#7E57C2">’</span><span style="color:#EC407A">s</span>
      <span class="long" style="color:var(--ink)">Drawing</span>
      <span style="color:var(--ink)">Pad</span>
    </h1>
    <div class="actions">
      <button class="act" id="undoBtn" aria-label="Undo" disabled><span class="ic">↩️</span><span class="lb">Undo</span></button>
      <button class="act" id="clearBtn" aria-label="Start over"><span class="ic">🧹</span><span class="lb">Start over</span></button>
      <button class="act" id="pagesBtn" aria-label="Colouring pages"><span class="ic">📄</span><span class="lb">Pages</span></button>
      <button class="act" id="galleryBtn" aria-label="My pictures"><span class="ic">🖼️</span><span class="lb">My pictures</span></button>
      <button class="act save" id="saveBtn" aria-label="Save picture"><span class="ic">💾</span><span class="lb">Save</span></button>
      <button class="act" id="soundBtn" aria-label="Sound on" aria-pressed="true"><span class="ic">🔊</span></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="paper" id="paper">
      <canvas id="paint"></canvas>
      <canvas id="lines"></canvas>
      <div class="mirror-guide" id="mirrorGuide" hidden></div>
    </div>
  </main>

  <section class="tray" aria-label="Drawing tools">
    <div class="row" id="toolRow"></div>
    <div class="row" id="colorRow"></div>
    <div class="row" id="stickerRow" hidden></div>
  </section>
</div>

<div class="sheet" id="pagesSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pagesTitle">
    <div class="panel-head">
      <h2 id="pagesTitle">Pick a page to colour</h2>
      <button class="close" data-close="pagesSheet" aria-label="Close">✕</button>
    </div>
    <div class="pages" id="pagesGrid"></div>
  </div>
</div>

<div class="sheet" id="gallerySheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
    <div class="panel-head">
      <h2 id="galleryTitle">My pictures</h2>
      <button class="close" data-close="gallerySheet" aria-label="Close">✕</button>
    </div>
    <div id="galleryBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ---------- Data ----------
  const COLORS = [
    ['Red', '#E53935'], ['Orange', '#FB8C00'], ['Yellow', '#FDD835'], ['Lime', '#9CCC65'],
    ['Green', '#2E7D32'], ['Sky blue', '#4FC3F7'], ['Blue', '#1E4FD8'], ['Purple', '#7E57C2'],
    ['Pink', '#F06292'], ['Light skin', '#F7CFAE'], ['Tan', '#C68B59'], ['Dark skin', '#7B4A2A'],
    ['Brown', '#6D4C41'], ['Grey', '#9E9E9E'], ['Black', '#212121'], ['White', '#FFFFFF']
  ];
  const TOOLS = [
    { id: 'crayon', icon: '🖍️', label: 'Crayon' },
    { id: 'marker', icon: '🖊️', label: 'Marker' },
    { id: 'rainbow', icon: '🌈', label: 'Rainbow' },
    { id: 'glitter', icon: '✨', label: 'Glitter' },
    { id: 'fill', icon: '🪣', label: 'Fill' },
    { id: 'sticker', icon: '⭐', label: 'Stickers' },
    { id: 'eraser', icon: '🧽', label: 'Eraser' }
  ];
  const STICKERS = ['⭐', '❤️', '🌈', '🦋', '🐶', '🐱', '🐰', '🦄', '🐘', '🌸', '🌻', '🍦', '🎈', '🚀', '☀️', '🐠', '🍎', '👑'];
  const BRUSH = [5, 12, 24];       // css px
  const STAMP = [40, 68, 104];     // css px
  const INK = '#1C1C24';
  const LW = 8;                    // line width in page units (page is 1000 x 1000)

  const state = { tool: 'crayon', color: '#E53935', size: 1, sticker: '⭐', mirror: false, sound: true, page: 'house', hue: 0 };

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const stage = $('stage'), paper = $('paper'), paint = $('paint'), lines = $('lines');
  const pctx = paint.getContext('2d', { willReadFrequently: true });
  const lctx = lines.getContext('2d', { willReadFrequently: true });

  // ---------- Paper size (fixed resolution, scaled to fit) ----------
  let W, H;
  {
    const r = stage.getBoundingClientRect();
    let aspect = (r.width || 800) / (r.height || 600);
    aspect = Math.min(1.6, Math.max(0.65, aspect));
    if (aspect >= 1) { W = 1400; H = Math.round(1400 / aspect); } else { H = 1400; W = Math.round(1400 * aspect); }
  }
  paint.width = lines.width = W; paint.height = lines.height = H;

  function resizePaper(w, h) {
    W = w; H = h;
    paint.width = lines.width = W; paint.height = lines.height = H;
    wallAlpha = new Uint8Array(W * H);
    fitPaper();
  }
  function fitPaper() {
    const r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    let w = r.width, h = r.width * H / W;
    if (h > r.height) { h = r.height; w = h * W / H; }
    paper.style.width = Math.floor(w) + 'px';
    paper.style.height = Math.floor(h) + 'px';
  }
  new ResizeObserver(fitPaper).observe(stage);
  fitPaper();

  // ---------- Line-art helpers ----------
  function roundRectPath(c, x, y, w, h, r) {
    const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
    c.moveTo(x + tl, y);
    c.lineTo(x + w - tr, y); c.arcTo(x + w, y, x + w, y + tr, tr);
    c.lineTo(x + w, y + h - br); c.arcTo(x + w, y + h, x + w - br, y + h, br);
    c.lineTo(x + bl, y + h); c.arcTo(x, y + h, x, y + h - bl, bl);
    c.lineTo(x, y + tl); c.arcTo(x, y, x + tl, y, tl);
    c.closePath();
  }

  function makeArt(ctx) {
    const cw = ctx.canvas.width, ch = ctx.canvas.height;
    const k = Math.min(cw, ch) / 1000 * 0.92;
    const ox = (cw - 1000 * k) / 2, oy = (ch - 1000 * k) / 2;
    const B = { L: -ox / k, R: (cw - ox) / k, T: -oy / k, Bt: (ch - oy) / k };
    ctx.setTransform(k, 0, 0, k, ox, oy);
    ctx.lineWidth = LW; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
    const g = {
      B, k, ox, oy, ctx,
      circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); },
      ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.stroke(); },
      poly(p, close = true) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); if (close) ctx.closePath(); ctx.stroke(); },
      line(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); },
      rrect(x, y, w, h, r) { ctx.beginPath(); roundRectPath(ctx, x, y, w, h, r); ctx.stroke(); },
      shape(fn) { ctx.beginPath(); fn(ctx); ctx.stroke(); },
      clipped(clip, draw) { ctx.save(); ctx.beginPath(); clip(ctx); ctx.clip(); draw(); ctx.restore(); },
      star(cx, cy, R, r, n = 5) {
        const p = [];
        for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R; p.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
        g.poly(p);
      },
      blob(circles) { // outline of a union of circles (clouds, tree tops)
        const off = document.createElement('canvas'); off.width = cw; off.height = ch;
        const o = off.getContext('2d');
        o.setTransform(k, 0, 0, k, ox, oy); o.lineWidth = LW * 2; o.strokeStyle = INK;
        circles.forEach(([x, y, r]) => { o.beginPath(); o.arc(x, y, r, 0, Math.PI * 2); o.stroke(); });
        o.globalCompositeOperation = 'destination-out';
        circles.forEach(([x, y, r]) => { o.beginPath(); o.arc(x, y, r, 0, Math.PI * 2); o.fill(); });
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(off, 0, 0); ctx.restore();
      }
    };
    return g;
  }
  const sun = (g, x, y, r) => {
    g.circle(x, y, r);
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.line(x + Math.cos(a) * (r + 20), y + Math.sin(a) * (r + 20), x + Math.cos(a) * (r + 52), y + Math.sin(a) * (r + 52)); }
  };
  const cloud = (g, x, y, s = 1) => g.blob([[x, y, 40 * s], [x + 50 * s, y - 25 * s, 52 * s], [x + 105 * s, y, 40 * s], [x + 52 * s, y + 14 * s, 42 * s]]);
  const flower = (g, cx, cy, n, pr, rx, ry, cr) => {
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; g.ellipse(cx + Math.cos(a) * pr, cy + Math.sin(a) * pr, rx, ry, a); }
    g.circle(cx, cy, cr);
  };
  const wavy = (g, y, amp, per) => g.shape(c => { c.moveTo(g.B.L, y); for (let x = g.B.L; x <= g.B.R + 10; x += 8) c.lineTo(x, y + amp * Math.sin(x / per)); });
  const seaweed = (g, x, base, h) => g.shape(c => {
    c.moveTo(x - 18, base);
    for (let t = 0; t <= h; t += 12) c.lineTo(x - 18 + 22 * Math.sin(t / 40), base - t);
    for (let t = h; t >= 0; t -= 12) c.lineTo(x + 18 + 22 * Math.sin(t / 40), base - t);
    c.closePath();
  });

  const PAGES = [
    { id: 'house', name: 'Sunny House', draw(g) {
      const { B } = g;
      sun(g, 150, 170, 70);
      cloud(g, 690, 170, 1);
      g.line(B.L, 780, B.R, 780);
      g.line(440, 780, 370, B.Bt); g.line(520, 780, 590, B.Bt);
      g.poly([300, 780, 300, 460, 660, 460, 660, 780]);
      g.poly([270, 460, 480, 285, 690, 460]);

    b.appendChild(c);
    const s = document.createElement('span'); s.textContent = p.name; b.appendChild(s);
    b.onclick = () => { setPage(p.id); closeSheet('pagesSheet'); play('fill'); toast(p.id === 'blank' ? 'Fresh paper! Draw anything 🖍️' : `${p.name} — tap the 🪣 to colour fast!`); };
    grid.appendChild(b);
  });
  function markCurrentPage() { grid.querySelectorAll('.page-btn').forEach(b => b.setAttribute('aria-current', b.dataset.page === state.page)); }

  // ---------- Saving: pictures and the drawing in progress ----------
  // IndexedDB keeps data for good on this device (the old version used small, easily-cleared storage).
  const GKEY = 'rangpad.gallery.v1', WKEY = 'rangpad.work.v1', MAX_PICS = 120;
  const idb = (() => {
    let p = null;
    const open = () => p || (p = new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open('aveer-drawing-pad', 1); } catch (e) { rej(e); return; }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('pics')) d.createObjectStore('pics', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error('blocked'));
      setTimeout(() => rej(new Error('timeout')), 5000);
    }));
    const run = (store, mode, fn) => open().then(d => new Promise((res, rej) => {
      const t = d.transaction(store, mode), r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
    return {
      all: () => run('pics', 'readonly', st => st.getAll()),
      put: v => run('pics', 'readwrite', st => st.put(v)),
      del: id => run('pics', 'readwrite', st => st.delete(id)),
      get: k => run('kv', 'readonly', st => st.get(k)),
      set: (k, v) => run('kv', 'readwrite', st => st.put(v, k))
    };
  })();
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (_) { return false; } };
  let storeMode = 'checking'; // 'idb' | 'local' | 'none'
  const storeReady = (async () => {
    try {
      await idb.all();
      storeMode = 'idb';
      const old = lsGet(GKEY); // move pictures saved by the older version
      if (Array.isArray(old) && old.length) { for (const pic of old) await idb.put(pic); try { localStorage.removeItem(GKEY); } catch (_) {} }
    } catch (_) {
      storeMode = lsSet('rangpad.check', 1) ? 'local' : 'none';
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {}
  })();

  async function listPics() {
    await storeReady;
    if (storeMode === 'idb') { try { return (await idb.all()).sort((a, b) => b.id - a.id); } catch (_) {} }
    return lsGet(GKEY) || [];
  }
  async function addPic(pic) {
    await storeReady;
    if (storeMode === 'idb') {
      try {
        await idb.put(pic);
        const all = await idb.all();
        if (all.length > MAX_PICS) for (const old of all.sort((a, b) => a.id - b.id).slice(0, all.length - MAX_PICS)) await idb.del(old.id);
        return true;
      } catch (_) {}
    }
    const list = lsGet(GKEY) || []; list.unshift(pic);
    while (list.length > 12) list.pop();
    let ok = lsSet(GKEY, list);
    while (!ok && list.length > 1) { list.pop(); ok = lsSet(GKEY, list); }
    return ok;
  }
  async function removePic(id) {
    await storeReady;
    if (storeMode === 'idb') { try { await idb.del(id); return; } catch (_) {} }
    lsSet(GKEY, (lsGet(GKEY) || []).filter(i => i.id !== id));
  }

  // The drawing on the paper is saved a moment after every change, and when the app is closed.
  async function loadWork() {
    await storeReady;
    if (storeMode === 'idb') { try { const w = await idb.get('work'); if (w) return w; } catch (_) {} }
    return lsGet(WKEY);
  }
  let workTimer = null, workDirty = false;
  function markWork() { workDirty = true; clearTimeout(workTimer); workTimer = setTimeout(saveWork, 900); }
  async function saveWork() {
    clearTimeout(workTimer);
    if (!workDirty) return;
    if (activeId !== null && document.visibilityState === 'visible') { workTimer = setTimeout(saveWork, 600); return; }
    workDirty = false;
    const w = { page: state.page, w: W, h: H, paint: paint.toDataURL('image/png'), at: Date.now() };
    await storeReady;
    if (storeMode === 'idb') { try { await idb.set('work', w); return; } catch (_) {} }
    lsSet(WKEY, w);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveWork(); });
  window.addEventListener('pagehide', () => { saveWork(); });

  function snapshotPicture() {
    const max = 1000, f = Math.min(1, max / Math.max(W, H));
    const c = document.createElement('canvas'); c.width = Math.round(W * f); c.height = Math.round(H * f);
    const x = c.getContext('2d');
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(paint, 0, 0, c.width, c.height); x.drawImage(lines, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.86);
  }
  let saving = false;
  $('saveBtn').onclick = async () => {
    unlockAudio();
    if (saving) return;
    saving = true;
    const ok = await addPic({ id: Date.now(), src: snapshotPicture() });
    saving = false;
    if (ok) { play('save'); toast('Saved to My pictures! ⭐'); }
    else toast('This browser is not saving pictures. Open the app from its Home Screen icon.');
  };

  function dataUrlToBlob(src) {
    const [head, b64] = src.split(','), mime = (head.match(/data:([^;]+)/) || [, 'image/jpeg'])[1];
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  async function shareToPhotos(item) {
    try {
      const d = new Date(item.id);
      const file = new File([dataUrlToBlob(item.src)], `aveer-drawing-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.jpg`, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    toast('Press and hold the picture, then choose Save to Photos');
  }

  function statusHTML() {
    if (storeMode === 'idb' || storeMode === 'local') return `<p class="save-status ok">✓ Pictures are saved on this device, even after the app is closed.</p>`;
    if (storeMode === 'none') return `<p class="save-status warn">⚠ This browser is not keeping pictures. Open the app from its Home Screen icon in Safari, not a private window.</p>`;
    return '';
  }

  let viewing = null, galleryToken = 0;
  async function renderGallery() {
    const token = ++galleryToken;
    const body = $('galleryBody');
    const list = await listPics();
    if (token !== galleryToken) return;
    body.innerHTML = '';
    if (viewing) {
      const item = list.find(i => i.id === viewing);
      if (item) {
        const canShare = !!navigator.share;
        const wrap = document.createElement('div'); wrap.className = 'viewer';
        wrap.innerHTML = `<img src="${item.src}" alt="My drawing"><p class="hint">${canShare ? 'Tap <b>Save to Photos</b> to keep a copy in the iPad’s Photos app. You can also press and hold the picture.' : 'To keep a copy in Photos, press and hold the picture (or right-click it) and choose <b>Save image</b>.'}</p>
          <div class="viewer-actions"><button class="act" id="backBtn"><span class="ic">⬅️</span><span>All pictures</span></button>
          ${canShare ? `<button class="act save" id="shareBtn"><span class="ic">📷</span><span>Save to Photos</span></button>` : ''}
          <button class="act danger" id="delBtn" data-armed="false"><span class="ic">🗑️</span><span id="delLb">Delete</span></button></div>`;
        body.appendChild(wrap);
        $('backBtn').onclick = () => { viewing = null; renderGallery(); };
        if ($('shareBtn')) $('shareBtn').onclick = () => shareToPhotos(item);
        $('delBtn').onclick = async () => {
          const btn = $('delBtn');
          if (btn.dataset.armed !== 'true') { btn.dataset.armed = 'true'; $('delLb').textContent = 'Tap again to delete'; return; }
          await removePic(viewing); viewing = null; renderGallery(); toast('Picture deleted');
        };
        return;
      }
      viewing = null;
    }
    if (!list.length) {
      body.innerHTML = `${statusHTML()}<div class="empty"><b>No pictures yet</b>Draw something, then press the yellow Save button.</div>`;
      return;
    }
    body.insertAdjacentHTML('beforeend', `${statusHTML()}<p class="count">${list.length} ${list.length === 1 ? 'picture' : 'pictures'}</p>`);
    const g = document.createElement('div'); g.className = 'gallery';
    list.forEach(item => {
      const b = document.createElement('button'); b.className = 'pic'; b.setAttribute('aria-label', 'Open picture');
      b.innerHTML = `<img src="${item.src}" alt="" loading="lazy">`;
      b.onclick = () => { viewing = item.id; renderGallery(); };
      g.appendChild(b);
    });
    body.appendChild(g);
  }

  // ---------- Sheets, toast, header ----------
  function openSheet(id) { $(id).hidden = false; }
  function closeSheet(id) { $(id).hidden = true; }
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeSheet(b.dataset.close));
  document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) s.hidden = true; }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.sheet').forEach(s => s.hidden = true);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });

  let toastTimer;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

  $('undoBtn').onclick = () => { unlockAudio(); undo(); };
  $('clearBtn').onclick = () => { unlockAudio(); pushUndo(); pctx.clearRect(0, 0, W, H); play('undo'); toast('All clean! Oops? Press Undo ↩️'); };
  $('pagesBtn').onclick = () => { unlockAudio(); markCurrentPage(); openSheet('pagesSheet'); play('pick'); };
  $('galleryBtn').onclick = () => { unlockAudio(); viewing = null; renderGallery(); openSheet('gallerySheet'); play('pick'); };
  $('soundBtn').onclick = () => {
    state.sound = !state.sound; unlockAudio();
    $('soundBtn').setAttribute('aria-pressed', state.sound);
    $('soundBtn').setAttribute('aria-label', state.sound ? 'Sound on' : 'Sound off');
    $('soundBtn').querySelector('.ic').textContent = state.sound ? '🔊' : '🔇';
    play('pick');
  };

  // ---------- Start: a colouring page with a little colour already in ----------
  const hot = window.claude && window.claude.hot;
  const saved = hot && hot.data;
  const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  async function start(data) {
    data = data || {};
    setTool('crayon');
    if (data.paint) {
      if (data.page) state.page = data.page;
      drawLines();
      try { pctx.drawImage(await loadImg(data.paint), 0, 0, W, H); } catch (_) {}
      return;
    }
    drawLines();
    let work = null;
    try { work = await loadWork(); } catch (_) {}
    if (undoStack.length) return; // he already started drawing
    if (work && work.paint) {
      try {
        const im = await loadImg(work.paint);
        if (undoStack.length) return;
        if (work.w && work.h && (work.w !== W || work.h !== H)) resizePaper(work.w, work.h);
        if (PAGES.some(p => p.id === work.page)) state.page = work.page;
        drawLines();
        pctx.clearRect(0, 0, W, H);
        pctx.drawImage(im, 0, 0, W, H);
        return;
      } catch (_) {}
    }
    pageById(state.page).sample.forEach(([vx, vy, col]) => floodFill(pageXf.ox + vx * pageXf.k, pageXf.oy + vy * pageXf.k, col));
  }
  if (hot && hot.snapshot) hot.snapshot(() => ({ page: state.page, paint: paint.toDataURL('image/png') }));
  if (hot && hot.ready) hot.ready(start); else start(saved || {});
})();
</script>

</body>
</html>
